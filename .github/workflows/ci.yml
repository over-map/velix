name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Design system guards
        # TokenGen tests; generated tokens, icons and map styles match their sources; styles validate; no SF Symbols; no colour literals outside Generated/.
        run: |
          swift test --package-path tools
          swift run --package-path tools TokenGen design/velix-tokens.json App/DesignSystem/Generated App/Resources/Assets.xcassets --check
          python3 tools/icongen.py
          git diff --exit-code -- App/DesignSystem/Generated App/Resources/Assets.xcassets/VelixIcons || { echo "Icons out of date: run python3 tools/icongen.py"; exit 1; }
          node tools/stylegen/stylegen.mjs --check
          npx --yes -p @maplibre/maplibre-gl-style-spec@26.4.4 gl-style-validate App/Resources/MapStyle/*.json
          if grep -rn "systemName:" App LiveActivity Shared --include='*.swift'; then echo "SF Symbols are not allowed (CLAUDE.md)"; exit 1; fi
          if grep -rnE 'Color\(red:|Color\(hex|"#[0-9A-Fa-f]{6}"' App LiveActivity Shared --include='*.swift' | grep -v '/Generated/'; then echo "Colour literal outside Generated/"; exit 1; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Velix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick simulator
        # Prefer iPhone 16 on iOS 18 (the snapshot reference device), else the newest iPhone.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")], reverse=True)
          pick = next((x["udid"] for k in ios if "iOS-18" in k for x in d[k] if x["name"] == "iPhone 16"), None)
          pick = pick or next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone"))
          print(pick)')
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build
        run: >
          xcodebuild -scheme Velix -destination "$DEST"
          -derivedDataPath build/DerivedData -skipMacroValidation -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO build

      - name: Latest region pack tag
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq '[.[].tagName | select(startswith("pack-lombardy-"))][0] // ""')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache region pack
        if: steps.pack.outputs.tag != ''
        uses: actions/cache@v4
        with:
          path: build/pack
          key: pack-${{ steps.pack.outputs.tag }}

      - name: Download region pack (golden route and map tests)
        if: steps.pack.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/pack
          if [ ! -f build/pack/valhalla_tiles.tar ]; then
            gh release download "${{ steps.pack.outputs.tag }}" -D build/pack -p 'valhalla_tiles.tar.xz' -p 'hazards.sqlite.xz' --clobber
            # Map tiles: packs from 2026.10 build 3 on (map goldens skip without them).
            gh release download "${{ steps.pack.outputs.tag }}" -D build/pack -p 'basemap.pmtiles.xz' -p 'overlays.pmtiles.xz' --clobber || true
            xz -d -T0 build/pack/*.xz
          fi
          # Timetable and city area (M8 transit golden test): cached packs from before M8 lack them.
          if [ ! -f build/pack/transit.sqlite ]; then
            gh release download "${{ steps.pack.outputs.tag }}" -D build/pack -p 'transit.sqlite.xz' --clobber || true
            gh release download "${{ steps.pack.outputs.tag }}" -D build/pack -p 'city.geojson.xz' --clobber || true
            ls build/pack/*.xz >/dev/null 2>&1 && xz -d -T0 build/pack/*.xz
          fi
          ls -lh build/pack

      - name: Test
        env:
          TEST_RUNNER_VELIX_PACK_DIR: ${{ github.workspace }}/build/pack
          TEST_RUNNER_VELIX_GOLDEN_OUT: ${{ github.workspace }}/build/golden
        run: >
          xcodebuild -scheme Velix -destination "$DEST"
          -derivedDataPath build/DerivedData -skipMacroValidation -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile
          -resultBundlePath build/Velix.xcresult
          CODE_SIGNING_ALLOWED=NO test

      - name: Upload golden routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-routes
          path: build/golden/
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Velix-xcresult
          path: build/Velix.xcresult
