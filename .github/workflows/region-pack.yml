name: Region pack

on:
  schedule:
    - cron: "0 3 1 * *"        # 1st of each month, 03:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (main only)"
        type: boolean
        default: false
  pull_request:
    paths: ["pipeline/**", ".github/workflows/region-pack.yml"]

permissions:
  contents: write              # create the Release; nothing else

concurrency:
  group: region-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false        # one region failing keeps the others (the index keeps its last good pack)
      matrix:
        region: [lombardy, piemonte, veneto, emilia-romagna, trentino-alto-adige]
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4

      - name: Month key
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # The Italy extract (≈ 2 GB) is shared by every region: one cache entry instead of one per region.
      - name: Cache the OSM extract
        uses: actions/cache@v4
        with:
          path: pipeline/cache/italy-latest.osm.pbf*
          key: osm-italy-${{ steps.month.outputs.key }}
          restore-keys: osm-italy-

      - name: Cache downloads (DEM, GTFS, planetiler inputs)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/cache
            !pipeline/cache/italy-latest.osm.pbf*
          key: pack-cache-${{ env.REGION }}-${{ steps.month.outputs.key }}
          restore-keys: pack-cache-${{ env.REGION }}-

      - name: Pipeline unit tests
        run: make -C pipeline test

      - name: Build pack
        run: make -C pipeline pack REGION=$REGION

      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          m = json.load(open(f"pipeline/out/{os.environ['REGION']}/pack/manifest.json"))
          print(f"## {m['name']} pack {m['version']}\n")
          print(f"Download **{m['download_bytes']/1e6:.1f} MB** (budget {m['budget_bytes']/1e6:.0f} MB) · on phone {m['unpacked_bytes']/1e6:.0f} MB\n")
          print("| File | Download | Unpacked |\n|---|---|---|")
          for f in m["files"]:
              print(f"| {f['name']} | {f['bytes']/1e6:.1f} MB | {f['unpacked_bytes']/1e6:.1f} MB |")
          PY

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ env.REGION }}
          path: pipeline/out/${{ env.REGION }}/pack/
          retention-days: 7

  # Golden route tests: Lombardy (the trips are in Milan); other regions have the pipeline's smoke stage.
  golden:
    needs: build
    if: always()              # runs when Lombardy built, even if another region failed (no artifact → fails)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: pack-lombardy
          path: build/pack

      - name: Unpack tiles, hazards, timetable, city area and cycle routes
        run: |
          xz -d -T0 build/pack/valhalla_tiles.tar.xz build/pack/hazards.sqlite.xz build/pack/transit.sqlite.xz build/pack/city.geojson.xz \
            build/pack/routes.sqlite.xz
          ls -lh build/pack

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")], reverse=True)
          pick = next((x["udid"] for k in ios if "iOS-18" in k for x in d[k] if x["name"] == "iPhone 16"), None)
          pick = pick or next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone"))
          print(pick)')
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: Golden route tests on the new pack
        env:
          TEST_RUNNER_VELIX_PACK_DIR: ${{ github.workspace }}/build/pack
          TEST_RUNNER_VELIX_GOLDEN_OUT: ${{ github.workspace }}/build/golden
        run: >
          xcodebuild -scheme Velix -destination "$DEST"
          -derivedDataPath build/DerivedData -skipMacroValidation -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO test -only-testing:VelixGoldenTests

      - name: Upload golden routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-routes-pack
          path: build/golden/
          if-no-files-found: ignore

  publish:
    needs: [build, golden]
    if: always() && needs.golden.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [lombardy, piemonte, veneto, emilia-romagna, trentino-alto-adige]
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4

      - name: Download pack artifact
        id: artifact
        continue-on-error: true   # that region's build failed: its last release stays in the index
        uses: actions/download-artifact@v4
        with:
          name: pack-${{ matrix.region }}
          path: pipeline/out/${{ matrix.region }}/pack

      - name: Publish release
        if: steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACK=pipeline/out/$REGION/pack
          NAME=$(python3 -c "import json;print(json.load(open('$PACK/manifest.json'))['name'])")
          VERSION=$(python3 -c "import json;print(json.load(open('$PACK/manifest.json'))['version'])")
          TAG="pack-$REGION-$VERSION"; N=1; TITLE="$NAME region pack $VERSION"
          while gh release view "$TAG" >/dev/null 2>&1; do
            N=$((N+1)); TAG="pack-$REGION-$VERSION.$N"; TITLE="$NAME region pack $VERSION (build $N)"
          done
          python3 pipeline/stages/release_notes.py "$PACK/manifest.json" > notes.md
          gh release create "$TAG" --title "$TITLE" --notes-file notes.md --latest=false "$PACK"/*

  # packs.json on the fixed Release `pack-index`: the newest published pack of every region (the app's catalog).
  index:
    needs: publish
    if: always() && needs.publish.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the region index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=()
          for cfg in pipeline/config/*.yml; do
            REGION=$(basename "$cfg" .yml); case "$REGION" in _*|bikes_allowed_rules) continue;; esac
            TAG=$(gh release list --limit 200 --json tagName,isDraft,isPrerelease,createdAt \
              -q "[.[] | select(.isDraft|not) | select(.isPrerelease|not) | select(.tagName | startswith(\"pack-$REGION-\"))] | sort_by(.createdAt) | last | .tagName // empty")
            [ -z "$TAG" ] && continue
            gh release download "$TAG" -p manifest.json -O "manifest-$REGION.json" --clobber
            ARGS+=("$TAG" "manifest-$REGION.json")
          done
          python3 pipeline/stages/index.py packs.json "${ARGS[@]}"
          gh release view pack-index >/dev/null 2>&1 || gh release create pack-index --title "Region pack index" \
            --notes "packs.json: the newest pack of every region (the app's catalog). Updated by the Region pack workflow." --latest=false
          gh release upload pack-index packs.json --clobber
