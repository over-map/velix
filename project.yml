name: Velix
options:
  bundleIdPrefix: io.github.over-map
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.57.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  MapLibreSwiftUI:
    url: https://github.com/maplibre/swiftui-dsl
    exactVersion: 0.25.0
  ValhallaMobile:
    url: https://github.com/Rallista/valhalla-mobile
    exactVersion: 0.6.3
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

targets:
  Velix:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/MapStyle/**"
      # Map styles and glyphs keep their folder structure (glyphs/<fontstack>/<range>.pbf).
      - path: App/Resources/MapStyle
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: VelixLiveActivity
      - package: Ferrostar
        product: FerrostarCore
      - package: Ferrostar
        product: FerrostarMapLibreUI
      - package: Ferrostar
        product: FerrostarSwiftUI
      - package: MapLibre
        product: MapLibre
      - package: MapLibreSwiftUI
        product: MapLibreSwiftUI
      - package: ValhallaMobile
        product: Valhalla
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Velix
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Velix uses your location to plan routes from where you are and to follow you while you ride. It never leaves your phone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Velix uses your location to plan routes from where you are and to follow you while you ride. It never leaves your phone."
        UIBackgroundModes: [location, audio]   # audio: voice prompts with the screen locked (M7)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - FamiljenGrotesk-Medium.ttf
          - FamiljenGrotesk-SemiBold.ttf
          - FamiljenGrotesk-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.over-map.velix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  VelixLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
      # Tokens, type, icons and fonts for the Live Activity (P2 LiveActivity); components stay in the app.
      - path: App/DesignSystem
        excludes:
          - "Components/**"
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Fonts
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Velix
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - FamiljenGrotesk-Medium.ttf
          - FamiljenGrotesk-SemiBold.ttf
          - FamiljenGrotesk-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.over-map.velix.LiveActivity

  VelixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: Velix
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.over-map.velix.tests

  VelixSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Snapshot
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: Velix
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.over-map.velix.snapshottests

  VelixGoldenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Golden
    dependencies:
      - target: Velix
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.over-map.velix.goldentests

schemes:
  Velix:
    build:
      targets:
        Velix: all
        VelixLiveActivity: all
    test:
      gatherCoverageData: false
      targets:
        - VelixTests
        - VelixSnapshotTests
        - VelixGoldenTests
    run:
      config: Debug
