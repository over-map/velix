# Velix region pack: Lombardy (iteration 1 pilot).
region:
  id: lombardy
  name: Lombardy
  osm_relation: 44879          # Lombardia, admin_level=4
  timezone: Europe/Rome
  country: {name: Italia, iso: IT, osm_relation: 2000365331}   # synthetic id (real 365331 + 2e9), see stages/country_admin.py
  city_area_relation: 44915    # Comune di Milano (admin_level=8): "destination outside the city area" transit trigger
osm:
  url: https://download.geofabrik.de/europe/italy/nord-ovest-latest.osm.pbf
  licence: ODbL-1.0
  attribution: "© OpenStreetMap contributors"
elevation:
  # GEDTM30: global 30 m *terrain* model (buildings and trees removed), Cloud Optimized GeoTIFF, values in dm.
  # Replaces Copernicus GLO-30 (a surface model: rooftops gave flat Milan streets fake 8–15 % grades).
  source: gedtm30
  url: "https://s3.opengeohub.org/global/edtm/gedtm_rf_m_30m_s_20060101_20151231_go_epsg.4326.3855_v20250611.tif"
  scale: 0.1
  licence: CC-BY-4.0
  attribution: "GEDTM30, Ho et al. (2025), OpenGeoHub, CC BY 4.0 (doi:10.5281/zenodo.15689805)"
transit:
  days: 60
  bike_rules: bikes_allowed_rules.yml   # curated, per region; used only where a feed has no trips.bikes_allowed
  feeds:
    - id: trenord
      name: Trenord (Orario Ferroviario Regionale GTFS)
      url: https://www.dati.lombardia.it/download/3z4k-mxz9/application%2Fzip
      licence: CC-BY-4.0
      attribution: Trenord, via Regione Lombardia open data
      route_types: [2, 100, 101, 102, 103, 106, 109]   # rail (basic + extended)
    - id: atm
      name: ATM Milano (GTFS, Comune di Milano ds929)
      url: https://dati.comune.milano.it/gtfs.zip
      licence: CC-BY-4.0
      attribution: ATM, via Comune di Milano open data
      route_types: [1, 401, 402]                        # metro (basic + extended)
valhalla:
  image: ghcr.io/valhalla/valhalla@sha256:511c095b8caf393dccceb8b519ec96b6f85a0166b2288ba014a8a748acc5a63c
  version: "3.9.0"
pack:
  budget_mb: 220            # download size (Filippo, 14 Oct 2026)
  xz_preset: 9
