# Velix region pack: Lombardy (iteration 1 pilot).
region:
  id: lombardy
  name: Lombardy
  osm_relation: 44879          # Lombardia, admin_level=4
  timezone: Europe/Rome
  country: {name: Italia, iso: IT, osm_relation: 2000365331}   # synthetic relation over the pack coverage, see stages/country_admin.py
  city_area_relation: 44915    # Comune di Milano (admin_level=8): "destination outside the city area" transit trigger
transit:
  feeds:
    - id: trenord
      name: Trenord (Orario Ferroviario Regionale GTFS)
      url: https://www.dati.lombardia.it/download/3z4k-mxz9/application%2Fzip
      licence: CC-BY-4.0
      attribution: Trenord, via Regione Lombardia open data
      route_types: [2, 100, 101, 102, 103, 106, 109]   # rail (basic + extended)
    - id: atm
      name: ATM Milano (GTFS, Comune di Milano ds929)
      url: https://dati.comune.milano.it/gtfs.zip
      licence: CC-BY-4.0
      attribution: ATM, via Comune di Milano open data
      route_types: [1, 401, 402]                        # metro (basic + extended)
smoke:
  hazards: {tram: 500, along: 200, cobbles: 1000, steps: 1000, gap: 1000, lane: 1000, dismount: 1000, door: 1}
  hazards_near:
    - {what: tram rails near Porta Venezia, lat: 45.4746, lon: 9.2050, m: 400, types: [tram, along]}
    - {what: cobbles in Brera (Via Fiori Chiari), lat: 45.4720, lon: 9.1870, m: 150, types: [cobbles]}
  lit_ways: 10000
  basemap_tiles: 8000
  cycle_ways: 20000
  stations: 300
  routes: 100
  eurovelo: [5]
  metro_families: {STIBM: {M1: red, M2: green, M3: yellow, M4: blue, M5: purple}}
  trains: [{from: Milano Centrale, to: Monza}]
  metro_stops: {"atm:M1": 30}
  metro_feed: atm
  bike_rule_operators: [atm, trenord]
  city_in: [9.2050, 45.4746]     # Porta Venezia
  city_out: [9.2740, 45.5885]    # Villa Reale, Monza
