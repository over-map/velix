# Velix region pack: Emilia-Romagna.
region:
  id: emilia-romagna
  name: Emilia-Romagna
  osm_relation: 42611
  timezone: Europe/Rome
  country: {name: Italia, iso: IT, osm_relation: 2000365331}   # synthetic relation over the pack coverage, see stages/country_admin.py
  city_area_relation: 43172    # Comune di Bologna (admin_level=8): "destination outside the city area" transit trigger
transit:
  feeds:
    - id: trenitalia
      name: Trenitalia (NeTEx, Italy's National Access Point)
      operator: Trenitalia
      format: netex
      nap: {dataset: 1077621, asset: TRENITALIA}
      modes: [rail]
      lines: [REG, RV, SFM, MET, DIR, IC]     # regional and Intercity: Frecce and night trains take no ordinary bikes
      licence: No licence, no contract (NAP MMTIS, EU 2017/1926)
      attribution: Trenitalia, via the National Access Point (CCISS, MIT)
    - id: tper
      name: Trenitalia Tper (NeTEx, Italy's National Access Point)
      operator: Trenitalia Tper
      format: netex
      nap: {dataset: 1561, asset: TRENITALIA-RER}
      modes: [rail]
      licence: No licence, no contract (NAP MMTIS, EU 2017/1926)
      attribution: Trenitalia Tper, Regione Emilia-Romagna, via the National Access Point (CCISS, MIT)
smoke:
  hazards: {cobbles: 100, steps: 200}
  lit_ways: 3000
  basemap_tiles: 6000
  cycle_ways: 5000
  routes: 30
  city_in: [11.3430, 44.4938]    # Piazza Maggiore
  city_out: [11.2750, 44.4760]   # Casalecchio di Reno
