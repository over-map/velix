# Curated bikes-on-board rules for Lombardy (BRIEF §8: "bikes-allowed connections only").
# Order of evidence, same in every region: a feed's own trips.txt bikes_allowed wins; these rules fill feeds
# that don't publish it; anything else is "check". Loaded into transit.sqlite → bike_rules. First matching rule wins.
# operator: the feed id in the region config.
# status: allowed | not_allowed | check   ("check" = the operator decides per train; tell the rider to check)
# routes: GTFS route_id without the feed prefix (ATM metro: M1…M5), or "*".
# weekdays: Mon..Sun as 7 characters of 0/1. Times are local, HH:MM, end exclusive.
# Reviewed: Filippo delegated the Trenord call to Claude (M2 PR, 14 Oct 2026); see DECISIONS.md.

- operator: atm
  routes: [M1, M2, M3]
  weekdays: "1111111"
  from: "00:00"
  until: "30:00"
  status: allowed
  carriage: "2nd or 5th carriage (doors with the bike sign), max 4 bikes per door"
  note: "Walk the bike in stations; lifts and stairs only, no escalators."
  source: "ATM, Bici sui mezzi (Nov 2024) §2.1–2.2: https://atm.it/it/ViaggiaConNoi/Documents/BICI%20SUI%20MEZZI.pdf"
  checked: 2026-10-14

- operator: atm
  routes: [M4, M5]
  weekdays: "1111111"
  from: "00:00"
  until: "30:00"
  status: allowed
  carriage: "First or last carriage (first or last door), max 3 bikes each"
  note: "Walk the bike in stations; lifts and stairs only, no escalators."
  source: "ATM, Bici sui mezzi (Nov 2024) §2.2: https://atm.it/it/ViaggiaConNoi/Documents/BICI%20SUI%20MEZZI.pdf"
  checked: 2026-10-14

- operator: trenord
  routes: ["*"]
  weekdays: "1111111"
  from: "00:00"
  until: "30:00"
  status: check
  carriage: "Carriage with the bike area"
  note: "Free inside Lombardy. Only specific trains and lines take non-folding bikes; the Trenord app shows it per train. The GTFS feed has no per-train flag. Guard may refuse when crowded."
  source: "Trenord, Trasporto biciclette: https://www.trenord.it/biglietti/agevolazioni-e-supplementi/trasporto-biciclette/"
  checked: 2026-10-14
