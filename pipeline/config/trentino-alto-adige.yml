# Velix region pack: Trentino-South Tyrol (Trentino-Alto Adige/Südtirol).
region:
  id: trentino-alto-adige
  name: Trentino-South Tyrol
  osm_relation: 45757
  timezone: Europe/Rome
  country: {name: Italia, iso: IT, osm_relation: 2000365331}   # synthetic relation over the pack coverage, see stages/country_admin.py
  city_area_relation: 46663    # Comune di Trento (admin_level=8): "destination outside the city area" transit trigger
transit:
  feeds:
    - id: trenitalia
      name: Trenitalia (NeTEx, Italy's National Access Point)
      operator: Trenitalia
      format: netex
      nap: {dataset: 1077621, asset: TRENITALIA}
      modes: [rail]
      lines: [REG, RV, SFM, MET, DIR, IC]     # regional and Intercity: Frecce and night trains take no ordinary bikes
      licence: No licence, no contract (NAP MMTIS, EU 2017/1926)
      attribution: Trenitalia, via the National Access Point (CCISS, MIT)
    - id: trento
      name: Trentino Trasporti (NeTEx, Italy's National Access Point)
      operator: Trentino Trasporti
      format: netex
      nap: {dataset: 2013, asset: IT-ITH20}
      modes: [rail]
      licence: No licence, no contract (NAP MMTIS, EU 2017/1926)
      attribution: Trentino Trasporti, Provincia autonoma di Trento, via the National Access Point (CCISS, MIT)
    - id: sad
      name: Alto Adige / Südtirol (NeTEx, Italy's National Access Point)
      operator: SAD
      format: netex
      nap: {dataset: 1401, asset: IT-ITH1}
      modes: [rail]
      licence: No licence, no contract (NAP MMTIS, EU 2017/1926)
      attribution: Provincia autonoma di Bolzano, via the National Access Point (CCISS, MIT)
smoke:
  hazards: {steps: 100}
  lit_ways: 1000
  basemap_tiles: 4000
  cycle_ways: 2000
  routes: 30
  city_in: [11.1215, 46.0670]    # Piazza Duomo
  city_out: [11.0400, 45.8910]   # Rovereto
